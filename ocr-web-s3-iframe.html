<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加数据 - OCR 识别插件（Web 端 iframe）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff; color: #303133; font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 插件 iframe 页面（整页即"添加数据"弹窗内容） ===== */
  .plugin {
    display: flex; flex-direction: column; height: 100vh; min-height: 0;
  }
  .plugin-head {
    padding: 14px 18px; border-bottom: 1px solid #ebeef5;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .plugin-title { font-size: 15px; font-weight: 600; color: #303133; }
  .plugin-title .tag { font-size: 11px; color: #909399; font-weight: 400; }
  .plugin-close { font-size: 20px; color: #909399; cursor: pointer; background: none; border: none; line-height: 1; }
  .plugin-close:hover { color: #606266; }
  .plugin-body { flex: 1; overflow: auto; padding: 14px 16px; min-height: 0; }
  .plugin-foot {
    padding: 12px 18px; border-top: 1px solid #ebeef5;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .plugin-foot .summary { font-size: 12px; color: #606266; visibility: hidden; }
  .plugin-foot .summary b { color: #389e0d; }
  .plugin-foot .actions { display: flex; gap: 10px; }
  .btn {
    padding: 6px 16px; border-radius: 4px; font-size: 12px; cursor: pointer;
    transition: all .15s; border: 1px solid #dcdfe6; background: #fff; color: #606266;
  }
  .btn:hover { color: #409eff; border-color: #409eff; }
  .btn.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .btn.primary:hover { background: #66b1ff; }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; background: #409eff; border-color: #409eff; }

  /* ===== 上传区 ===== */
  .s3-upload-zone {
    border: 2px dashed #d0d5dd; border-radius: 8px; padding: 28px 20px;
    text-align: center; cursor: pointer; transition: all .2s;
    background: #fafbfc; margin-bottom: 14px; position: relative;
  }
  .s3-upload-zone:hover, .s3-upload-zone.dragover { border-color: #409eff; background: #f0f7ff; }
  .s3-upload-zone .uz-icon { font-size: 32px; margin-bottom: 8px; color: #909399; }
  .s3-upload-zone:hover .uz-icon, .s3-upload-zone.dragover .uz-icon { color: #409eff; }
  .s3-upload-zone .uz-text { font-size: 13px; color: #606266; margin-bottom: 4px; }
  .s3-upload-zone .uz-hint { font-size: 11px; color: #c0c4cc; }
  .s3-upload-zone:hover .uz-hint, .s3-upload-zone.dragover .uz-hint { color: #909399; }
  .s3-upload-zone input[type=file] { display: none; }

  /* ===== 摘要栏 ===== */
  .s3-summary-bar {
    display: none; align-items: center; gap: 16px; padding: 8px 14px;
    background: #f5f7fa; border-radius: 6px; margin-bottom: 12px; font-size: 12px; flex-wrap: wrap;
  }
  .s3-summary-bar .stat { display: flex; align-items: center; gap: 4px; color: #606266; }
  .s3-summary-bar .stat b { font-size: 14px; }
  .s3-summary-bar .stat.success b { color: #67c23a; }
  .s3-summary-bar .stat.dup b { color: #e6a23c; }
  .s3-summary-bar .stat.err b { color: #f56c6c; }
  .s3-summary-bar .stat.proc b { color: #909399; }
  .s3-summary-bar .divider { width: 1px; height: 16px; background: #dcdfe6; }

  /* ===== 列表头 ===== */
  .s3-list-head {
    display: none; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .s3-list-head .title { font-size: 13px; font-weight: 600; color: #303133; }
  .s3-list-head .title span { font-weight: 400; color: #909399; }
  .s3-list-actions { display: flex; gap: 8px; }
  .s3-list-actions button {
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
    border: 1px solid #dcdfe6; background: #fff; color: #606266; transition: all .15s;
  }
  .s3-list-actions button:hover { color: #409eff; border-color: #409eff; }
  .s3-list-actions button.danger:hover { color: #f56c6c; border-color: #f56c6c; }

  /* ===== 结果表 ===== */
  .s3-table-wrap { max-height: 300px; overflow: auto; border: 1px solid #ebeef5; border-radius: 6px; }
  .s3-result-table { width: 100%; border-collapse: collapse; font-size: 12px; display: none; }
  .s3-result-table th, .s3-result-table td { padding: 9px 10px; border-bottom: 1px solid #ebeef5; text-align: left; color: #606266; }
  .s3-result-table th { background: #f5f7fa; font-weight: 500; color: #909399; font-size: 11px; position: sticky; top: 0; }
  .s3-result-table th:first-child, .s3-result-table td:first-child { padding-left: 14px; }
  .s3-result-table th:last-child, .s3-result-table td:last-child { padding-right: 14px; }
  .s3-result-table .col-chk { width: 36px; text-align: center; }
  .s3-result-table .col-name { min-width: 120px; }
  .s3-result-table .col-status { width: 90px; text-align: center; }
  .s3-result-table .col-action { width: 70px; text-align: center; }
  .s3-result-table tbody tr { transition: background .15s; }
  .s3-result-table tbody tr:hover { background: #f5f7fa; }
  .s3-result-table .rchk { width: 15px; height: 15px; cursor: pointer; accent-color: #409eff; }
  .s3-result-table .rchk:disabled { cursor: not-allowed; opacity: .4; }
  .s3-result-table .fname { color: #303133; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; display: block; }
  .s3-result-table .fval { color: #606266; font-family: "SF Mono", "Menlo", monospace; font-size: 11px; }

  .s3-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .s3-badge.ok { background: #f0f9eb; color: #67c23a; }
  .s3-badge.proc { background: #f5f7fa; color: #909399; }
  .s3-badge.dup { background: #fdf6ec; color: #e6a23c; }
  .s3-badge.err { background: #fef0f0; color: #f56c6c; }
  .s3-badge .spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  .s3-retry-btn { padding: 2px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; border: none; background: #fef0f0; color: #f56c6c; transition: all .15s; }
  .s3-retry-btn:hover { background: #f56c6c; color: #fff; }
  .s3-remove-btn { padding: 2px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; border: none; background: #f5f7fa; color: #909399; transition: all .15s; margin-left: 4px; }
  .s3-remove-btn:hover { background: #f56c6c; color: #fff; }

  .s3-empty-state { text-align: center; padding: 40px 20px; color: #c0c4cc; }
  .s3-empty-state .es-icon { font-size: 40px; margin-bottom: 10px; }
  .s3-empty-state .es-text { font-size: 13px; }

  /* 独立打开时的提示条（iframe 内嵌时自动隐藏） */
  .standalone-hint {
    display: none; padding: 8px 14px; background: #fffbe6; color: #e6a23c;
    font-size: 12px; border-bottom: 1px solid #f5dab1;
  }
</style>
</head>
<body>
<div class="plugin">
  <div class="plugin-head">
    <div class="plugin-title">添加数据 <span class="tag">（自定义插件 iframe 弹窗）</span></div>
    <button class="plugin-close" onclick="doClose()" title="关闭">×</button>
  </div>

  <!-- 独立打开提示（嵌入 iframe 时隐藏） -->
  <div class="standalone-hint" id="standaloneHint">
    当前为独立预览模式。嵌入工单页面的 iframe 后，本提示自动隐藏，「确定」将通过 postMessage 通知父页面回填数据。
  </div>

  <div class="plugin-body">
    <!-- 上传区域 -->
    <div class="s3-upload-zone" id="s3UploadZone" onclick="document.getElementById('s3FileInput').click()">
      <div class="uz-icon">📎</div>
      <div class="uz-text">拖拽文件到此处，或<span style="color:#409eff;"> 点击上传</span></div>
      <div class="uz-hint">支持 jpg、png、pdf 格式，单文件不超过 10MB</div>
      <input type="file" id="s3FileInput" multiple accept=".jpg,.jpeg,.png,.pdf" onchange="s3HandleFiles(this.files)">
    </div>

    <!-- 状态摘要栏 -->
    <div class="s3-summary-bar" id="s3SummaryBar">
      <div class="stat proc" id="s3StatProc"><b>0</b> 解析中</div>
      <div class="stat success" id="s3StatOk"><b>0</b> 成功</div>
      <div class="divider"></div>
      <div class="stat dup" id="s3StatDup"><b>0</b> 重复</div>
      <div class="stat err" id="s3StatErr"><b>0</b> 失败</div>
    </div>

    <!-- 识别结果列表头 -->
    <div class="s3-list-head" id="s3ListHead">
      <div class="title">📋 识别结果 <span id="s3Count">(共 0 条)</span></div>
      <div class="s3-list-actions">
        <button onclick="s3SelectAll()" id="s3SelectAllBtn">全选成功</button>
        <button onclick="s3ClearAll()" class="danger">清空列表</button>
      </div>
    </div>

    <div class="s3-table-wrap">
      <div class="s3-empty-state" id="s3EmptyState">
        <div class="es-icon">📋</div>
        <div class="es-text">上传附件后将在此显示解析结果</div>
      </div>
      <table class="s3-result-table" id="s3ResultTable">
        <thead>
          <tr>
            <th class="col-chk"><input type="checkbox" id="s3CheckAll" onchange="s3ToggleAll(this.checked)"></th>
            <th class="col-name">文件名</th>
            <th>字段 A</th>
            <th>字段 B</th>
            <th>字段 C</th>
            <th class="col-status">状态</th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="s3ResultTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="plugin-foot">
    <div class="summary" id="s3FootSummary">已选择 <b id="s3SelectedCount">0</b> 条</div>
    <div class="actions">
      <button class="btn" onclick="doClose()">取消</button>
      <button class="btn primary" onclick="s3Confirm()" id="s3ConfirmBtn" disabled>确定</button>
    </div>
  </div>
</div>

<script>
  /* ===== 状态机：'pending' → 'parsing' → 'success' | 'duplicate' | 'error' ===== */
  var S3_DATA = [];           // { id, filename, fieldA, fieldB, fieldC, status }
  var S3_ID_SEQ = 0;
  var S3_PARSING = false;
  var S3_PARSE_QUEUE = [];

  // 模拟后端解析结果池（轮转使用）
  var S3_MOCK_POOL = [
    { fieldA: '67163448', fieldB: '2022-10-12', fieldC: '星辰信息技术有限公司', result: 'success' },
    { fieldA: '67163449', fieldB: '2022-10-13', fieldC: '海港云联技术有限公司', result: 'success' },
    { fieldA: '67163450', fieldB: '2022-10-14', fieldC: '南方数据技术有限公司', result: 'duplicate' },
    { fieldA: '67163451', fieldB: '2022-10-15', fieldC: '鹏程未来科技有限公司', result: 'error' },
    { fieldA: '67163452', fieldB: '2022-11-01', fieldC: '钱塘江岸数据有限公司', result: 'success' },
    { fieldA: '67163453', fieldB: '2022-11-05', fieldC: '锦城智创软件有限公司', result: 'success' },
    { fieldA: '67163454', fieldB: '2022-11-08', fieldC: '江城启航科技有限公司', result: 'duplicate' },
  ];
  var S3_MOCK_IDX = 0;

  function s3NextMock() {
    var m = S3_MOCK_POOL[S3_MOCK_IDX % S3_MOCK_POOL.length];
    S3_MOCK_IDX++;
    return m;
  }

  /* ===== UI 刷新 ===== */
  function s3RenderTable() {
    var tbody = document.getElementById('s3ResultTbody');
    var table = document.getElementById('s3ResultTable');
    var empty = document.getElementById('s3EmptyState');
    var listHead = document.getElementById('s3ListHead');
    var summaryBar = document.getElementById('s3SummaryBar');

    if (S3_DATA.length === 0) {
      table.style.display = 'none';
      empty.style.display = '';
      listHead.style.display = 'none';
      summaryBar.style.display = 'none';
      document.getElementById('s3FootSummary').style.visibility = 'hidden';
      document.getElementById('s3ConfirmBtn').disabled = true;
      return;
    }

    table.style.display = '';
    empty.style.display = 'none';
    listHead.style.display = 'flex';
    summaryBar.style.display = 'flex';

    tbody.innerHTML = S3_DATA.map(function(item) {
      var disabled = item.status !== 'success' ? ' disabled' : '';
      var checked = item.status === 'success' ? ' checked' : '';
      var fieldA = item.fieldA || '—';
      var fieldB = item.fieldB || '—';
      var fieldC = item.fieldC || '—';

      var badgeHtml = '';
      if (item.status === 'parsing') {
        badgeHtml = '<span class="s3-badge proc"><span class="spin"></span>识别中</span>';
      } else if (item.status === 'success') {
        badgeHtml = '<span class="s3-badge ok">✓ 已识别</span>';
      } else if (item.status === 'duplicate') {
        badgeHtml = '<span class="s3-badge dup">⚠ 重复</span>';
      } else if (item.status === 'error') {
        badgeHtml = '<span class="s3-badge err">✗ 失败</span>';
      }

      var actionHtml = '';
      if (item.status === 'error') {
        actionHtml = '<button class="s3-retry-btn" onclick="s3RetryItem(\'' + item.id + '\')">重试</button>';
      } else if (item.status === 'duplicate') {
        actionHtml = '<span style="color:#c0c4cc;font-size:11px;">不可选</span>';
      }
      actionHtml += '<button class="s3-remove-btn" onclick="s3RemoveItem(\'' + item.id + '\')" title="移除">✕</button>';

      return '<tr>' +
        '<td class="col-chk"><input type="checkbox" class="s3-item-chk rchk"' + disabled + checked + ' onchange="s3OnCheck()" data-id="' + item.id + '"></td>' +
        '<td><span class="fname">' + item.filename + '</span></td>' +
        '<td><span class="fval">' + fieldA + '</span></td>' +
        '<td><span class="fval">' + fieldB + '</span></td>' +
        '<td><span class="fval">' + fieldC + '</span></td>' +
        '<td class="col-status">' + badgeHtml + '</td>' +
        '<td class="col-action">' + actionHtml + '</td>' +
        '</tr>';
    }).join('');

    s3UpdateSummary();
    s3UpdateCheckAll();
  }

  function s3UpdateSummary() {
    var ok = 0, dup = 0, err = 0, proc = 0, total = S3_DATA.length;
    S3_DATA.forEach(function(d) {
      if (d.status === 'success') ok++;
      else if (d.status === 'duplicate') dup++;
      else if (d.status === 'error') err++;
      else if (d.status === 'parsing') proc++;
    });

    document.getElementById('s3StatProc').innerHTML = '<b>' + proc + '</b> 解析中';
    document.getElementById('s3StatOk').innerHTML = '<b>' + ok + '</b> 成功';
    document.getElementById('s3StatDup').innerHTML = '<b>' + dup + '</b> 重复';
    document.getElementById('s3StatErr').innerHTML = '<b>' + err + '</b> 失败';
    document.getElementById('s3Count').textContent = '(共 ' + total + ' 条)';

    var checked = document.querySelectorAll('#s3ResultTbody .s3-item-chk:checked').length;
    if (checked > 0) {
      document.getElementById('s3FootSummary').style.visibility = 'visible';
      document.getElementById('s3SelectedCount').textContent = checked;
      document.getElementById('s3ConfirmBtn').disabled = false;
    } else {
      document.getElementById('s3FootSummary').style.visibility = 'hidden';
      document.getElementById('s3ConfirmBtn').disabled = true;
    }
  }

  function s3UpdateCheckAll() {
    var checkAll = document.getElementById('s3CheckAll');
    var items = document.querySelectorAll('#s3ResultTbody .s3-item-chk:not(:disabled)');
    var checked = document.querySelectorAll('#s3ResultTbody .s3-item-chk:checked');
    if (items.length === 0) {
      checkAll.checked = false; checkAll.indeterminate = false;
    } else if (checked.length === items.length) {
      checkAll.checked = true; checkAll.indeterminate = false;
    } else {
      checkAll.checked = false; checkAll.indeterminate = checked.length > 0;
    }
  }

  function s3OnCheck() { s3UpdateSummary(); s3UpdateCheckAll(); }
  function s3ToggleAll(checked) {
    document.querySelectorAll('#s3ResultTbody .s3-item-chk:not(:disabled)').forEach(function(cb) {
      cb.checked = checked;
    });
    s3UpdateSummary();
  }

  /* ===== 文件上传处理 ===== */
  function s3HandleFiles(fileList) {
    if (!fileList || fileList.length === 0) return;
    var files = Array.from(fileList);
    document.getElementById('s3FileInput').value = '';

    files.forEach(function(file) {
      S3_ID_SEQ++;
      var id = 's3f_' + S3_ID_SEQ;
      var dup = S3_DATA.some(function(d) { return d.filename === file.name; });
      S3_DATA.push({
        id: id,
        filename: file.name,
        fieldA: '', fieldB: '', fieldC: '',
        status: 'pending',
        _isDupName: dup,
      });
    });

    s3RenderTable();
    s3StartParsing();
  }

  function s3StartParsing() {
    if (S3_PARSING) return;
    var pending = S3_DATA.filter(function(d) { return d.status === 'pending'; });
    if (pending.length === 0) return;

    pending.forEach(function(d) { d.status = 'parsing'; });
    s3RenderTable();

    S3_PARSING = true;
    var idx = 0;
    function parseNext() {
      if (idx >= pending.length) { S3_PARSING = false; s3RenderTable(); return; }
      var item = pending[idx];
      idx++;

      setTimeout(function() {
        setTimeout(function() {
          if (item._isDupName) {
            item.status = 'duplicate';
            item.fieldA = item.fieldB = item.fieldC = '';
          } else {
            var mock = s3NextMock();
            item.status = mock.result;
            if (mock.result === 'success') {
              item.fieldA = mock.fieldA;
              item.fieldB = mock.fieldB;
              item.fieldC = mock.fieldC;
            } else {
              item.fieldA = item.fieldB = item.fieldC = '';
            }
          }
          s3RenderTable();
          parseNext();
        }, 500 + Math.random() * 800);
      }, 200 + Math.random() * 300);
    }
    parseNext();
  }

  /* ===== 重试 / 移除 / 清空 / 全选 ===== */
  function s3RetryItem(id) {
    var item = S3_DATA.find(function(d) { return d.id === id; });
    if (!item) return;
    item.status = 'parsing';
    item._isDupName = false;
    s3RenderTable();

    setTimeout(function() {
      var mock = s3NextMock();
      item.status = mock.result;
      if (mock.result === 'success') {
        item.fieldA = mock.fieldA;
        item.fieldB = mock.fieldB;
        item.fieldC = mock.fieldC;
      } else {
        item.fieldA = item.fieldB = item.fieldC = '';
      }
      s3RenderTable();
    }, 800 + Math.random() * 600);
  }

  function s3RemoveItem(id) {
    S3_DATA = S3_DATA.filter(function(d) { return d.id !== id; });
    s3RenderTable();
  }

  function s3ClearAll() {
    S3_DATA = [];
    S3_PARSE_QUEUE = [];
    S3_PARSING = false;
    s3RenderTable();
  }

  function s3SelectAll() {
    document.querySelectorAll('#s3ResultTbody .s3-item-chk:not(:disabled)').forEach(function(cb) {
      cb.checked = true;
    });
    s3UpdateSummary();
    s3UpdateCheckAll();
  }

  /* ===== 确认 / 关闭（通过 postMessage 与父页面通信） ===== */
  function isEmbedded() {
    try { return window.parent !== window; } catch (e) { return false; }
  }

  function s3Confirm() {
    var checked = document.querySelectorAll('#s3ResultTbody .s3-item-chk:checked');
    if (checked.length === 0) return;

    var items = [];
    checked.forEach(function(chk) {
      var itemId = chk.getAttribute('data-id');
      var item = S3_DATA.find(function(d) { return d.id === itemId; });
      if (item) {
        items.push({ filename: item.filename, fieldA: item.fieldA, fieldB: item.fieldB, fieldC: item.fieldC });
      }
    });

    if (isEmbedded()) {
      // 嵌入工单页面时：通知父页面回填并关闭 iframe
      window.parent.postMessage({ type: 'OCR_IFRAME_CONFIRM', items: items }, '*');
    } else {
      // 独立预览：弹窗展示选中结果
      var txt = items.map(function(it, i) {
        return (i + 1) + '. ' + it.filename + ' → ' + it.fieldA + ' | ' + it.fieldB + ' | ' + it.fieldC;
      }).join('\n');
      alert('已确认选择 ' + items.length + ' 条数据：\n\n' + txt);
    }
  }

  function doClose() {
    if (isEmbedded()) {
      window.parent.postMessage({ type: 'OCR_IFRAME_CLOSE' }, '*');
    } else {
      alert('独立预览模式：关闭动作将由父页面（工单页）接管。');
    }
  }

  /* ===== 拖拽支持 ===== */
  (function() {
    var zone = null;
    function setupDrag() {
      zone = document.getElementById('s3UploadZone');
      if (!zone) { setTimeout(setupDrag, 200); return; }
      ['dragenter','dragover','dragleave','drop'].forEach(function(evt) {
        zone.addEventListener(evt, function(e) { e.preventDefault(); e.stopPropagation(); });
      });
      ['dragenter','dragover'].forEach(function(evt) {
        zone.addEventListener(evt, function() { zone.classList.add('dragover'); });
      });
      ['dragleave','drop'].forEach(function(evt) {
        zone.addEventListener(evt, function() { zone.classList.remove('dragover'); });
      });
      zone.addEventListener('drop', function(e) {
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          s3HandleFiles(e.dataTransfer.files);
        }
      });
    }
    if (document.readyState === 'complete') setupDrag();
    else window.addEventListener('load', setupDrag);

    // 独立打开时显示提示条
    try {
      if (window.parent === window) {
        document.getElementById('standaloneHint').style.display = 'block';
      }
    } catch (e) {
      document.getElementById('standaloneHint').style.display = 'block';
    }
  })();
</script>
</body>
</html>
